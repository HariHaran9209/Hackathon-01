# ==============================================================================
# Pitchly — Render Blueprint (pitchly directory root)
# ==============================================================================

services:
  - type: web
    name: pitchly-backend
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input
    preDeployCommand: python manage.py migrate
    startCommand: daphne -b 0.0.0.0 -p $PORT pitchly_backend.asgi:application
    healthCheckPath: /health/
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"
      - key: DATABASE_URL
        fromDatabase:
          name: pitchly-db
          property: connectionString
      - key: NEBIUS_BASE_URL
        value: "https://api.studio.nebius.ai/v1"
      - key: NEBIUS_API_KEY
        sync: false
      - key: FAST_MODEL
        value: "meta-llama/Meta-Llama-3.1-8B-Instruct"
      - key: REASONING_MODEL
        value: "deepseek-ai/DeepSeek-R1-Distill-Llama-70B"

  - type: web
    name: pitchly-frontend
    runtime: static
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: pitchly-backend
          property: host

databases:
  - name: pitchly-db
    databaseName: pitchly
    user: pitchly
    plan: free
    region: oregon
