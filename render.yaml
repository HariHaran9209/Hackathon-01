# ==============================================================================
# Pitchly — Render Blueprint Specification (render.yaml)
# https://render.com/docs/blueprint-spec
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # Backend API & WebSocket Service (Django + Daphne ASGI)
  # ----------------------------------------------------------------------------
  - type: web
    name: pitchly-backend
    runtime: python
    plan: free
    region: oregon
    rootDir: pitchly/backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input
    preDeployCommand: python manage.py migrate
    startCommand: daphne -b 0.0.0.0 -p $PORT pitchly_backend.asgi:application
    healthCheckPath: /health/
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"
      # Automatically connects to Render Postgres database
      - key: DATABASE_URL
        fromDatabase:
          name: pitchly-db
          property: connectionString
      # Nebius Token Factory / OpenAI-compatible endpoint credentials
      - key: NEBIUS_BASE_URL
        value: "https://api.studio.nebius.ai/v1"
      - key: NEBIUS_API_KEY
        sync: false # Render will prompt you to enter your API key in dashboard
      - key: FAST_MODEL
        value: "meta-llama/Meta-Llama-3.1-8B-Instruct"
      - key: REASONING_MODEL
        value: "deepseek-ai/DeepSeek-R1-Distill-Llama-70B"

  # ----------------------------------------------------------------------------
  # Frontend Static Web App (React + Vite + dnd-kit)
  # ----------------------------------------------------------------------------
  - type: web
    name: pitchly-frontend
    runtime: static
    plan: free
    region: oregon
    rootDir: pitchly/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: pitchly-backend
          property: host

# ------------------------------------------------------------------------------
# Managed PostgreSQL Database (Render Free Tier)
# ------------------------------------------------------------------------------
databases:
  - name: pitchly-db
    databaseName: pitchly
    user: pitchly
    plan: free
    region: oregon
